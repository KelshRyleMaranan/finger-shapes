<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finger Shapes</title>
  <meta
    name="description"
    content="Hand-tracking webcam toy. Connect your fingers to make shapes: color inside, gray outside."
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="stage" id="stage">
      <video id="video" autoplay playsinline muted hidden></video>
      <canvas id="overlay" hidden></canvas>
      <p class="stage-message" id="status">Camera is off</p>
      <p class="toast" id="toast" aria-live="polite"></p>
    </section>

    <aside class="rail">
      <button
        id="startBtn"
        class="shutter"
        type="button"
        title="Start camera"
        aria-label="Start camera"
        disabled
      >
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" />
          <circle cx="12" cy="13" r="3.5" />
        </svg>
      </button>

      <button
        id="swapBtn"
        class="tool"
        type="button"
        title="Swap colors"
        aria-label="Swap colors"
        aria-pressed="false"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="8.5" />
          <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none" />
        </svg>
      </button>

      <button
        id="filterBtn"
        class="tool"
        type="button"
        title="Filter: NONE"
        aria-label="Filter: NONE. Click to change."
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 4.5l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5-5.5-2 5.5-2z" />
        </svg>
      </button>

      <label class="tool swatch" title="Dot and line color">
        <input
          id="colorInput"
          type="color"
          value="#ffd21f"
          aria-label="Dot and line color"
        />
      </label>
    </aside>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
