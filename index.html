<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finger Shapes</title>
  <meta
    name="description"
    content="Hand-tracking webcam toy. Connect your fingers to make shapes: color inside, gray outside."
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="stage" id="stage">
      <video id="video" autoplay playsinline muted hidden></video>
      <p class="stage-message" id="status">Camera is off</p>
    </section>

    <aside class="rail">
      <button
        id="startBtn"
        class="shutter"
        type="button"
        title="Start camera"
        aria-label="Start camera"
        disabled
      >
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" />
          <circle cx="12" cy="13" r="3.5" />
        </svg>
      </button>
    </aside>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
