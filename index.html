<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finger Shapes</title>
  <meta
    name="description"
    content="Hand-tracking webcam toy. Connect your fingers to make shapes and fill them with live filters."
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <aside class="rail rail-left">
      <label class="gear" aria-label="Color">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M5.6 18.4l1.7-1.7M16.7 7.3l1.7-1.7" />
        </svg>
        <input id="colorInput" type="color" value="#ffd21f" aria-label="Color" />
      </label>

      <button
        id="filterBtn"
        class="tool"
        type="button"
        aria-label="Random filters"
        aria-pressed="false"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="13.5" r="7" />
          <path d="M12 10v4l2.5 1.5" />
          <path d="M9.5 3.5h5" />
          <path class="slash" d="M4 3.5l16 17" />
        </svg>
      </button>
    </aside>

    <section class="stage" id="stage">
      <video id="video" autoplay playsinline muted hidden></video>
      <canvas id="overlay" hidden></canvas>
      <p class="stage-message" id="status">Camera is off</p>
    </section>

    <aside class="rail rail-right">
      <button
        id="startBtn"
        class="shutter"
        type="button"
        title="Start camera"
        aria-label="Start camera"
        disabled
      >
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" />
          <circle cx="12" cy="13" r="3.5" />
        </svg>
      </button>
    </aside>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
